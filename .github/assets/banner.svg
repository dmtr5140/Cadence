<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<radialGradient id="auroraA"><stop offset="0" stop-color="#7c5cff" stop-opacity=".62"/><stop offset=".5" stop-color="#4a2fb8" stop-opacity=".2"/><stop offset="1" stop-color="#4a2fb8" stop-opacity="0"/></radialGradient>
<radialGradient id="auroraB"><stop offset="0" stop-color="#2fd8c8" stop-opacity=".5"/><stop offset=".48" stop-color="#12867f" stop-opacity=".16"/><stop offset="1" stop-color="#12867f" stop-opacity="0"/></radialGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6a8ff"/><stop offset=".55" stop-color="#8b7cff"/><stop offset="1" stop-color="#2fd8c8"/></linearGradient>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset=".5" stop-color="#4a2fb8"/><stop offset="1" stop-color="#0f4a52"/></linearGradient>
<linearGradient id="karaoke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".62" stop-color="#ffffff"/><stop offset=".63" stop-color="#4c4c5a"/><stop offset="1" stop-color="#4c4c5a"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2fd8c8"/></linearGradient>
<clipPath id="round"><rect width="1280" height="560" rx="28"/></clipPath>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
<style>
.a1{animation:pulse 11s ease-in-out infinite alternate}
.a2{animation:pulse 11s ease-in-out -5.5s infinite alternate}
@keyframes pulse{to{opacity:.55}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.05s ease-in-out infinite alternate}
.eq2{animation-delay:-.35s}.eq3{animation-delay:-.7s}
@keyframes eq{to{transform:scaleY(.35)}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 18s linear infinite}
@keyframes pg{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
.kw{animation:kw 6s ease-in-out infinite alternate}
@keyframes kw{from{transform:translateX(0)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="560" fill="#08080c"/>
<ellipse class="a1" cx="30" cy="530" rx="620" ry="450" fill="url(#auroraA)"/>
<ellipse class="a2" cx="1270" cy="20" rx="600" ry="430" fill="url(#auroraB)"/>

<g transform="translate(80 56)"><rect width="330" height="44" rx="22" fill="#ffffff0d" stroke="#ffffff1f"/><circle cx="26" cy="22" r="4.5" fill="#2fd8c8"/><text x="44" y="29" font-size="15.5" font-weight="600" fill="#dcdce4" letter-spacing="1.4">V2.0 · NATIVE ON IPHONE</text></g>

<text x="80" y="200" font-size="94" font-weight="800" fill="#fff" letter-spacing="-3.5">Cad<tspan fill="url(#title)">ence</tspan></text>
<text x="82" y="256" font-size="30" font-weight="600" fill="#f2f2f6">YouTube Music, with the lyrics it deserved.</text>
<text x="82" y="298" font-size="21" fill="#9d9daa">Syllable timing, karaoke, Canvas, five services and Siri — no ads.</text>

<g transform="translate(80 344)"><rect width="180" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#8b7cff"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">10 lyric sources</text></g>
<g transform="translate(276 344)"><rect width="104" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#8b7cff"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">Karaoke</text></g>
<g transform="translate(396 344)"><rect width="163" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#8b7cff"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">AI translation</text></g>
<g transform="translate(80 402)"><rect width="95" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#2fd8c8"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">Canvas</text></g>
<g transform="translate(191 402)"><rect width="169" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#2fd8c8"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">5 music services</text></g>
<g transform="translate(376 402)"><rect width="180" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#2fd8c8"/><text x="38" y="29" font-size="15.5" font-weight="500" fill="#e8e8ee">Siri &amp; Shortcuts</text></g>

<g transform="translate(776 30)">
<rect width="424" height="500" rx="30" fill="#101016" stroke="#ffffff17"/>
<g filter="url(#soft)" opacity=".55"><rect x="70" y="54" width="284" height="284" rx="26" fill="url(#art)"/></g>
<rect x="70" y="46" width="284" height="284" rx="26" fill="url(#art)"/>
<text x="70" y="382" font-size="21" font-weight="700" fill="#fff">Neon Rain</text>
<text x="70" y="408" font-size="14.5" fill="#9d9daa">Halcyon Drive</text>
<rect x="70" y="430" width="284" height="4" rx="2" fill="#ffffff14"/>
<rect class="pg" x="70" y="430" width="284" height="4" rx="2" fill="url(#bar)"/>
<g fill="#8b7cff"><rect class="eq" x="330" y="464" width="4" height="24" rx="2"/><rect class="eq eq2" x="338" y="464" width="4" height="24" rx="2"/><rect class="eq eq3" x="346" y="464" width="4" height="24" rx="2"/></g>
<text class="kw" x="70" y="470" font-size="16" font-weight="600" fill="url(#karaoke)">and the city keeps on calling</text>
<text x="70" y="494" font-size="16" fill="#3f3f4c">every light a little colder</text>
</g>
</g></svg>
